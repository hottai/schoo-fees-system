<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School Fees System</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f2744">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f0f3f8;--card:#fff;--ink:#142033;--mut:#5a6b7d;--line:#d8e0ea;--btn:#0f2744;--soft:#e8eef6;--g:#1b7a3d;--o:#c45e00;--r:#b42318;--acc:#c9a227;--header:#0f2744;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1520;--card:#142230;--ink:#e8eef5;--mut:#9db0c3;--line:#243447;--btn:#2d5a8a;--soft:#1a2b3d;--g:#3d9a55;--o:#d97a2a;--r:#d94a42;--acc:#d4b44a;--header:#0b1520;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1520;--card:#142230;--ink:#e8eef5;--mut:#9db0c3;--line:#243447;--btn:#2d5a8a;--soft:#1a2b3d;--g:#3d9a55;--o:#d97a2a;--r:#d94a42;--acc:#d4b44a;--header:#0b1520;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;padding-bottom:88px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--header);z-index:20}
header{background:var(--header);color:#fff;padding:18px 16px 16px;border-bottom:3px solid var(--acc);position:relative}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#fff}
.sn{font-size:19px;font-weight:700;letter-spacing:-.02em}.sub{font-size:12px;color:#b8c9dc;margin-top:2px}
.header-actions{position:absolute;top:14px;right:14px;display:flex;gap:6px}
.icon-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 14px}
.stat{border-radius:10px;padding:14px 12px;color:#fff}.stat b{display:block;font-size:19px;font-weight:700}.stat span{font-size:11px;opacity:.9;text-transform:uppercase;letter-spacing:.03em}
h2{font-size:14px;margin:0 0 12px;color:var(--ink);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);font:inherit;font-size:15px;margin:3px 0 11px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--btn);outline-offset:1px}
label{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.b{display:inline-block;background:var(--btn);color:#fff;border:0;border-radius:7px;padding:10px 16px;font:inherit;font-weight:600;font-size:14px;text-decoration:none;cursor:pointer}
.b2{background:transparent;color:var(--btn);border:1.5px solid var(--btn)}.wa{background:#128c7e}.dg{background:var(--r)}.sm{padding:7px 11px;font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.list{margin:12px 14px;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.03)}.list .row:last-child{border-bottom:0}
.pill{color:#fff;font-size:10px;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap;letter-spacing:.02em}.pill.g{background:var(--g)}.pill.o{background:var(--o)}.pill.r{background:var(--r)}
.mut{color:var(--mut);font-size:12px}.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px}
.chips{display:flex;gap:7px;margin:0 14px;flex-wrap:wrap}.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:12px;font-weight:600;cursor:pointer}.chip.on{background:var(--btn);color:#fff;border-color:var(--btn)}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10;box-shadow:0 -2px 10px rgba(0,0,0,.06)}
#tabs button{flex:1;background:none;border:0;border-top:3px solid transparent;padding:11px 4px;font:inherit;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}#tabs button.on{color:var(--btn);border-top-color:var(--acc)}
details{margin:12px 14px}summary{font-weight:700;color:var(--btn);padding:8px 0;cursor:pointer;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(10,20,35,.65);display:flex;align-items:center;justify-content:center;padding:14px;z-index:30;overflow:auto}
.rc{background:#fff;color:#142033;border:1px solid #0f2744;border-radius:6px;width:100%;max-width:400px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.rc .h{background:#0f2744;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rc .h .school-name{font-weight:700;font-size:15px}.rc .h .receipt-meta{text-align:right;font-size:11px;line-height:1.4;opacity:.9}
.rc .bd{padding:16px}.rc .amt{background:#f0f4f9;border-radius:6px;text-align:center;font-size:26px;font-weight:700;color:#0f2744;padding:12px;margin:12px 0;letter-spacing:-.02em}
.rc p{margin:5px 0;font-size:13px}.rc .ft{display:flex;gap:8px;padding:0 16px 16px;flex-wrap:wrap}
.statement{background:#fff;color:#142033;max-width:520px;width:100%;border-radius:6px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.statement .sh{background:#0f2744;color:#fff;padding:16px}.statement .sb{padding:16px}
.statement table{width:100%;border-collapse:collapse;font-size:12px;margin:12px 0}
.statement th,.statement td{border:1px solid #d0d8e4;padding:7px 8px;text-align:left}.statement th{background:#f0f4f9;font-weight:700}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#142033;color:#fff;padding:9px 16px;border-radius:6px;opacity:0;transition:opacity .2s;z-index:40;font-size:13px;font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.2)}
body.ro .w{display:none!important}.lk{max-width:380px;margin:48px auto}
.breakdown{font-size:13px;margin:12px 0;padding:12px;background:var(--soft);border-radius:8px}.breakdown div{display:flex;justify-content:space-between;margin:4px 0}
.section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:18px 14px 6px}
@media screen and (min-width:900px){html{background:#dfe6f0}body{max-width:860px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 0 1px var(--line)}#tabs{left:50%;right:auto;width:860px;transform:translateX(-50%)}#app>.grid{grid-template-columns:repeat(4,1fr)}.b,.chip,.row[onclick]{cursor:pointer}.b:hover{filter:brightness(1.08)}.row[onclick]:hover{background:var(--soft)}}
@media print{body>*:not(#modal){display:none!important}body::before{display:none}.modal{position:static;background:none;padding:0}.noprint{display:none!important}.rc,.statement{box-shadow:none;border:1px solid #333;max-width:100%}}
</style>
</head>
<body>
<div id="app"></div><div id="tabs"></div><div id="modal"></div><div id="toast"></div>
<script>
const KEY="feesSystem.v3",$=s=>document.querySelector(s);
const esc=t=>String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const money=n=>Math.round(n||0).toLocaleString("en-US"),uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
const fdate=d=>{const x=new Date(d+"T00:00:00");return isNaN(x)?d:x.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})};
const METHODS=["Cash","MTN MoMo","Airtel Money","Bank","Other"];
function load(){try{let r=localStorage.getItem(KEY);if(!r){r=localStorage.getItem("feesTracker.v2")||localStorage.getItem("feesTracker.v1");if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.pupils)){o.version=3;localStorage.setItem(KEY,JSON.stringify(o));return o}}}if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.pupils))return o}}catch(e){}
return{version:3,school:{name:"Your School Name",term:"Term 3",year:"2026",cur:"UGX",deadline:"",payinfo:"Pay via MTN MoMo or at the school office.",address:"",phone:"",motto:"",logo:""},fees:{},pupils:[],rc:0,theme:"system",log:[],auth:{}}}
let S=load(),tab="home",sel=null,q="",flt="all",clsFlt="all",modal=null,armed=null,role=null,tries=0,wait=0,idle;
function mig(){S.log=S.log||[];S.auth=S.auth||{};S.fees=S.fees||{};S.theme=S.theme||"system";S.school.phone=S.school.phone||"";S.school.logo=S.school.logo||"";S.pupils.forEach(p=>{p.adm=p.adm||"";p.arr=p.arr||0;p.base=p.base!=null?p.base:p.due;p.pays=(p.pays||[]).map(x=>({...x,method:x.method||"Cash"}))})}
mig();applyTheme();
const hh=s=>{let a=5381,b=52711;for(const c of s+"|fees"){a=(a*33^c.charCodeAt(0))>>>0;b=(b*31+c.charCodeAt(0))>>>0}return a.toString(36)+b.toString(36)};
const nowL=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
function logit(a){S.log.push({t:nowL(),r:role,a});if(S.log.length>500)S.log.shift();save()}
function lock(){role=null;render()}
function bump(){clearTimeout(idle);if(role)idle=setTimeout(lock,3e5)}
["click","touchstart","keydown"].forEach(e=>addEventListener(e,bump));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Could not save on this device")}}
function toast(t){const e=$("#toast");e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2000)}
function applyTheme(){const t=S.theme||"system";if(t==="dark")document.documentElement.setAttribute("data-theme","dark");else if(t==="light")document.documentElement.setAttribute("data-theme","light");else document.documentElement.removeAttribute("data-theme")}
const calc=p=>{const paid=(p.pays||[]).reduce((a,x)=>a+(x.void?0:x.amt),0),bal=p.due-paid;return{paid,bal,st:bal<=0?"PAID":paid===0?"NONE":"PART"}};
const ST={PAID:["PAID","g"],PART:["PART","o"],NONE:["UNPAID","r"]};
const pill=s=>`<span class="pill ${ST[s][1]}">${ST[s][0]}</span>`;
function ph(raw){const d=String(raw||"").replace(/\D/g,"");if(!d)return"";if(d.startsWith("256"))return d;if(d.startsWith("0"))return"256"+d.slice(1);if(d.length===9)return"256"+d;return d}
const showPh=i=>i&&i.startsWith("256")?"0"+i.slice(3):(i||"");
const num=v=>{const n=parseFloat(String(v).replace(/[^\d.]/g,""));return isNaN(n)?0:n};
function msg(p){const c=calc(p),s=S.school;return`Dear Parent/Guardian,\n\nThis is an official fees reminder from ${s.name}.\n\nPupil: ${p.name}${p.adm?" ("+p.adm+")":""}\nClass: ${p.cls}\nTerm: ${s.term} ${s.year}\n\nAmount due: ${s.cur} ${money(c.bal)}\nAlready paid: ${s.cur} ${money(c.paid)} of ${money(p.due)}\n\n`+(s.deadline?`Please clear the balance by ${s.deadline}.\n`:"")+(s.payinfo?s.payinfo+"\n":"")+`\nThank you.\n${s.name}`}
const wa=(p,t)=>`https://wa.me/${ph(p.phone)}?text=${encodeURIComponent(t)}`;
const P_=id=>S.pupils.find(p=>p.id===id);
function nextAdm(){const ys=(S.school.year||"").slice(-2);return `${ys}${String(S.pupils.length+1).padStart(3,"0")}`}
function feeFor(cls){return S.fees[cls]||0}

function home(){
const P=S.pupils;let due=0,paid=0;const cl={};
P.forEach(p=>{const c=Math.min(calc(p).paid,p.due);due+=p.due;paid+=c;cl[p.cls]=cl[p.cls]||{d:0,p:0};cl[p.cls].d+=p.due;cl[p.cls].p+=c});
if(!P.length)return`<div class="card"><h2>Welcome</h2><p>No pupil records yet.</p><p class="mut">Go to the <b>Pupils</b> tab to add learners, or paste a full class list from Excel.</p><p class="mut">All data is stored on this device. Use Settings to create regular backups.</p></div>`;
const pct=due?Math.round(paid/due*100):0,n={PAID:0,PART:0,NONE:0};P.forEach(p=>n[calc(p).st]++);
const top=P.filter(p=>calc(p).bal>0).sort((a,b)=>calc(b).bal-calc(a).bal).slice(0,6);
const needBackup=!S.lb||Date.now()-S.lb>6048e5;
return`${needBackup?`<div class="card" style="border-left:4px solid var(--o)"><b>Backup recommended</b><p class="mut" style="margin:6px 0 0">More than 7 days since last backup. Download one from Settings.</p></div>`:""}
<div class="grid">
<div class="stat" style="background:#0f2744"><b>${money(due)}</b><span>Expected</span></div>
<div class="stat" style="background:#1b7a3d"><b>${money(paid)}</b><span>Collected</span></div>
<div class="stat" style="background:#b42318"><b>${money(Math.max(due-paid,0))}</b><span>Outstanding</span></div>
<div class="stat" style="background:#0b6e99"><b>${pct}%</b><span>Collection Rate</span></div>
</div>
<div class="card"><p style="margin:0;font-size:14px"><b>${P.length}</b> pupils · <span style="color:var(--g)"><b>${n.PAID}</b> paid</span> · <span style="color:var(--o)"><b>${n.PART}</b> partial</span> · <span style="color:var(--r)"><b>${n.NONE}</b> unpaid</span></p></div>
${top.length?`<div class="section-title">Priority Debtors</div><div class="list">${top.map(p=>{const c=calc(p);return`<div class="row" onclick="pick('${p.id}')" style="cursor:pointer"><div><b>${esc(p.name)}</b><div class="mut">${esc(p.cls)}${p.adm?" · "+esc(p.adm):""}</div></div><div style="text-align:right"><div style="color:var(--r);font-weight:700">${S.school.cur} ${money(c.bal)}</div>${pill(c.st)}</div></div>`}).join("")}</div>`:""}
<div class="section-title">Collection by Class</div><div class="card">${Object.keys(cl).sort().map(k=>{const v=cl[k],r=v.d?Math.round(v.p/v.d*100):0,col=r>=80?"var(--g)":r>=50?"var(--o)":"var(--r)";return`<div style="margin-bottom:14px"><div class="mut" style="display:flex;justify-content:space-between;margin-bottom:4px"><b style="color:var(--ink)">${esc(k)}</b><span>${money(v.p)} / ${money(v.d)} · ${r}%</span></div><div class="bar"><i style="width:${r}%;background:${col}"></i></div></div>`}).join("")}</div>`}

function plist(){
const t=q.trim().toLowerCase();
const L=S.pupils.filter(p=>{const hay=(p.name+" "+p.cls+" "+(p.adm||"")+" "+showPh(p.phone)).toLowerCase();return(!t||hay.includes(t))&&(flt==="all"||(flt==="owe"?calc(p).bal>0:calc(p).bal<=0))&&(clsFlt==="all"||p.cls===clsFlt)}).sort((a,b)=>a.cls.localeCompare(b.cls)||a.name.localeCompare(b.name));
return L.length?`<div class="list">${L.map(p=>{const c=calc(p);const last=(p.pays||[]).filter(x=>!x.void).slice(-1)[0];return`<div class="row" onclick="pick('${p.id}')" style="cursor:pointer"><div><b>${esc(p.name)}</b>${p.adm?` <span class="mut">#${esc(p.adm)}</span>`:""}<div class="mut">${esc(p.cls)} · Bal ${money(Math.max(c.bal,0))}${last?" · Last "+fdate(last.date):""}</div></div>${pill(c.st)}</div>`}).join("")}</div>`:`<p class="mut" style="margin:16px 14px">No matching pupils.</p>`}

function pupils(){
const classes=[...new Set(S.pupils.map(p=>p.cls))].sort();
return`<details class="w" ${S.pupils.length?"":"open"}><summary>+ Register new pupil</summary><div class="card" style="margin:0">
<label>Full name</label><input id="an" placeholder="As on school records">
<label>Admission number</label><input id="aa" placeholder="Auto: ${nextAdm()}">
<label>Class / Stream</label><input id="ac" placeholder="e.g. P.3 East" list="classlist" oninput="const f=feeFor(this.value);if(f&&!$('#af').value)$('#af').value=f">
<datalist id="classlist">${Object.keys(S.fees).map(c=>`<option value="${esc(c)}">`).join("")}${classes.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
<label>Parent / Guardian phone</label><input id="ap" inputmode="tel" placeholder="07xxxxxxxx">
<label>Total fees due (${esc(S.school.cur)})</label><input id="af" inputmode="numeric">
<button class="b" onclick="addP()">Register pupil</button></div></details>
<details class="w"><summary>+ Bulk register (paste from Excel)</summary><div class="card" style="margin:0"><p class="mut" style="margin-top:0">One per line: <b>Name, Class, Phone, Fees</b> or <b>Name, Class, Fees</b></p>
<textarea id="bk" rows="5" placeholder="Nakato Grace, P.1, 0701234567, 350000"></textarea><button class="b" onclick="addMany()">Register all</button></div></details>
<div style="margin:0 14px"><input id="qs" placeholder="Search name, class, admission or phone" value="${esc(q)}" oninput="q=this.value;$('#pl').innerHTML=plist()"></div>
<div class="chips" style="margin-top:10px">${[["all","All"],["owe","Owing"],["paid","Cleared"]].map(([k,l])=>`<button class="chip ${flt===k?"on":""}" onclick="flt='${k}';render()">${l}</button>`).join("")}</div>
${classes.length>1?`<div class="chips" style="margin-top:6px"><button class="chip ${clsFlt==="all"?"on":""}" onclick="clsFlt='all';render()">All classes</button>${classes.map(c=>`<button class="chip ${clsFlt===c?"on":""}" onclick="clsFlt='${esc(c)}';render()">${esc(c)}</button>`).join("")}</div>`:""}
<div id="pl">${plist()}</div>`}

function detail(){
const p=P_(sel);if(!p){sel=null;return pupils()}const c=calc(p),s=S.school,arr=p.arr||0,curFee=p.due-arr;
return`<div style="margin:12px 14px"><button class="b b2 sm" onclick="sel=null;render()">← Back to list</button></div>
<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><h2 style="margin:0;text-transform:none;letter-spacing:0;font-size:18px">${esc(p.name)}</h2>
<div class="mut" style="margin-top:3px">${esc(p.cls)}${p.adm?" · Adm #"+esc(p.adm):""}${p.phone?" · "+esc(showPh(p.phone)):""}</div></div>${pill(c.st)}</div>
<div class="breakdown"><div><span>Current term fee</span><b>${s.cur} ${money(curFee)}</b></div>
${arr?`<div><span>Arrears brought forward</span><b>${s.cur} ${money(arr)}</b></div>`:""}
<div><span>Total amount due</span><b>${s.cur} ${money(p.due)}</b></div>
<div><span>Amount paid</span><b style="color:var(--g)">${s.cur} ${money(c.paid)}</b></div>
<div style="border-top:1px solid var(--line);padding-top:6px;margin-top:6px"><span>Outstanding balance</span><b style="color:${c.bal>0?"var(--r)":"var(--g)"}">${s.cur} ${money(Math.max(c.bal,0))}</b></div></div>
${(p.hist||[]).map(h=>`<div class="mut">Previous: ${esc(h.t)} — paid ${money(h.p)} of ${money(h.d)}</div>`).join("")}
<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
${c.bal>0?`<a class="b wa sm" target="_blank" rel="noopener" href="${wa(p,msg(p))}">WhatsApp reminder</a>`:""}
${p.phone?`<a class="b b2 sm" href="tel:+${p.phone}">Call parent</a>`:""}
<button class="b b2 sm" onclick="showStatement('${p.id}')">Fee statement</button></div></div>
<div class="card w"><h2>Record payment</h2>
<label>Amount (${esc(s.cur)})</label><input id="pa" inputmode="numeric">
<label>Date</label><input id="pd" type="date" value="${today()}">
<label>Payment method</label><select id="pm">${METHODS.map(m=>`<option value="${m}">${m}</option>`).join("")}</select>
<label>Reference / Note</label><input id="pn" placeholder="e.g. MoMo transaction ID">
<button class="b" onclick="addPay('${p.id}')">Save payment & issue receipt</button></div>
<div class="section-title">Payment history</div>
<div class="list">${p.pays&&p.pays.length?p.pays.slice().reverse().map(x=>`<div class="row"><div${x.void?' style="text-decoration:line-through;opacity:.55"':''}><b>${s.cur} ${money(x.amt)}</b><div class="mut">${fdate(x.date)} · ${esc(x.method||"Cash")}${x.note?" · "+esc(x.note):""} · ${esc(x.no)}</div></div><div>${x.void?`<span class="mut">VOID<br>${esc(x.void.why)}</span>`:`<button class="b sm" onclick="showR('${p.id}','${x.id}')">Receipt</button> <button class="b b2 sm w" onclick="voidPay('${p.id}','${x.id}')">Void</button>`}</div></div>`).join(""):`<div class="row mut">No payments recorded yet.</div>`}</div>
<details class="w"><summary>Edit pupil record</summary><div class="card" style="margin:0">
<label>Full name</label><input id="en" value="${esc(p.name)}">
<label>Admission number</label><input id="ea" value="${esc(p.adm||"")}">
<label>Class</label><input id="ec" value="${esc(p.cls)}" list="classlist2">
<datalist id="classlist2">${Object.keys(S.fees).map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
<label>Parent phone</label><input id="ep" inputmode="tel" value="${esc(p.phone?showPh(p.phone):"")}">
<label>Total fees due</label><input id="ef" inputmode="numeric" value="${p.due}">
<button class="b" onclick="editP('${p.id}')">Save changes</button>
<button class="b dg" onclick="ask(this,'dp',()=>delP('${p.id}'))">Delete pupil</button></div></details>`}

function rem(){
const L=S.pupils.filter(p=>calc(p).bal>0).sort((a,b)=>calc(b).bal-calc(a).bal);
if(!L.length)return`<div class="card"><h2>Reminders</h2><p>All pupils are fully paid for the current term.</p></div>`;
return`<div class="card"><h2>Parent reminders</h2><p class="mut" style="margin:0">Messages are pre-written. Sorted by highest balance.</p></div>
<div class="list">${L.map(p=>{const c=calc(p);return`<div class="row"><div><b>${esc(p.name)}</b> <span class="mut">${esc(p.cls)}${p.adm?" · #"+esc(p.adm):""}</span><div class="mut">Owes ${S.school.cur} ${money(c.bal)}${p.phone?" · "+esc(showPh(p.phone)):" · No phone"}</div></div>
<div style="display:flex;gap:6px"><a class="b wa sm" target="_blank" rel="noopener" href="${wa(p,msg(p))}">WhatsApp</a>${p.phone?`<a class="b b2 sm" href="tel:+${p.phone}">Call</a>`:""}</div></div>`}).join("")}</div>`}

function sett(){
const F=[["name","School name"],["term","Current term"],["year","Academic year"],["cur","Currency"],["deadline","Payment deadline"],["payinfo","Payment instructions"],["address","School address"],["phone","School phone"],["motto","Motto or short note"]],RN={b:"Bursar",h:"Head",d:"Dev"};
const feeRows=Object.keys(S.fees).sort().map(c=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><input value="${esc(c)}" style="flex:1" onchange="const old='${esc(c)}';const v=this.value.trim();if(v&&v!==old){S.fees[v]=S.fees[old];delete S.fees[old];save();render()}"><input type="number" value="${S.fees[c]}" style="width:120px" onchange="S.fees['${esc(c)}']=num(this.value);save();toast('Updated')"><button class="b b2 sm" onclick="delete S.fees['${esc(c)}'];save();render()">Remove</button></div>`).join("");
return`<div class="card w"><h2>School profile</h2>${F.map(([k,l])=>`<label>${l}</label><input value="${esc(S.school[k]||"")}" onchange="S.school.${k}=this.value;logit('Updated ${k}');save();toast('Saved')">`).join("")}
<label>School logo (optional)</label><input type="file" accept="image/*" onchange="loadLogo(this)">
${S.school.logo?`<div style="margin-top:8px"><img src="${S.school.logo}" style="max-height:60px;border-radius:6px"> <button class="b b2 sm" onclick="S.school.logo='';save();render()">Remove logo</button></div>`:""}</div>
<div class="card w"><h2>Standard fees by class</h2><p class="mut" style="margin-top:0">Suggested automatically when registering pupils.</p>
${feeRows||'<p class="mut">No class fees defined yet.</p>'}
<div style="display:flex;gap:8px;margin-top:10px"><input id="nfc" placeholder="Class e.g. P.3" style="flex:1"><input id="nff" type="number" placeholder="Amount" style="width:120px"><button class="b sm" onclick="const c=$('#nfc').value.trim(),f=num($('#nff').value);if(!c){toast('Enter class');return}S.fees[c]=f;save();render();toast('Added')">Add</button></div></div>
<div class="card"><h2>Appearance</h2><label>Theme</label><select onchange="S.theme=this.value;applyTheme();save();toast('Updated')"><option value="system" ${S.theme==="system"?"selected":""}>System</option><option value="light" ${S.theme==="light"?"selected":""}>Light</option><option value="dark" ${S.theme==="dark"?"selected":""}>Dark</option></select></div>
<div class="card"><h2>Reports & exports</h2><button class="b sm" onclick="csv(0)">Full pupil register (CSV)</button> <button class="b b2 sm" onclick="csv(1)">Defaulters only (CSV)</button></div>
<div class="card w"><h2>Close term & start new term</h2><p class="mut" style="margin-top:0">Archives payments, carries balances forward as arrears, resets for new term.</p><button class="b" onclick="newTerm()">Start new term</button></div>
<div class="card w"><h2>Backup & restore</h2><p class="mut" style="margin-top:0">Download at least weekly. Keep safe on WhatsApp or cloud drive.</p>
<button class="b" onclick="bkFile()">Download backup file</button> <button class="b b2" onclick="backup()">Show backup text</button>
<label style="display:block;margin-top:12px">Restore from file</label><input type="file" accept=".json,.txt" onchange="rf(this)">
<textarea id="bt" rows="3" placeholder="Or paste backup text here"></textarea><button class="b b2" onclick="restore()">Restore</button></div>
${role==="d"?`<div class="card"><h2>Administrator controls</h2><label>New bursar PIN</label><input id="n1" type="password" inputmode="numeric" maxlength="6"><label>New head teacher PIN</label><input id="n2" type="password" inputmode="numeric" maxlength="6"><button class="b" onclick="newPins()">Update PINs</button> <button class="b dg" onclick="ask(this,'clr',()=>{S.pupils=[];S.rc=0;logit('Cleared all records');render();toast('Cleared')})">Clear all pupil data</button></div>`:""}
<div class="card"><h2>Activity log</h2>${S.log.slice(-50).reverse().map(e=>`<div class="mut" style="padding:6px 0;border-bottom:1px solid var(--line)">${esc(e.t.replace("T"," "))} · ${RN[e.r]||"—"} · ${esc(e.a)}</div>`).join("")||'<p class="mut">No activity yet.</p>'}</div>`}

function rcpt(){
const{p,x,to}=modal,s=S.school,bal=Math.max(p.due-to,0),roleName={b:"Bursar",h:"Head Teacher",d:"Administrator"}[role]||"Authorised Officer";
const text=`${s.name}\n${s.address?s.address+"\n":""}${s.phone?"Tel: "+s.phone+"\n":""}OFFICIAL RECEIPT No. ${x.no}\nDate: ${fdate(x.date)}\n\nReceived from: Parent/Guardian of ${p.name}${p.adm?" ("+p.adm+")":""}\nClass: ${p.cls}\nAmount: ${s.cur} ${money(x.amt)}\nMethod: ${x.method||"Cash"}${x.note?" ("+x.note+")":""}\nBeing: School fees – ${s.term} ${s.year}\n\nFees due: ${s.cur} ${money(p.due)}\nPaid to date: ${s.cur} ${money(to)}\nBalance: ${s.cur} ${money(bal)}\n\n${s.motto?s.motto+"\n":""}Thank you.\n${s.name}`;
return`<div class="modal" onclick="if(event.target===this){modal=null;render()}"><div class="rc">
<div class="h"><div>${s.logo?`<img src="${s.logo}" style="height:36px;border-radius:4px;margin-bottom:6px;background:#fff">`:""}<div class="school-name">${esc(s.name)}</div>${s.address?`<div style="font-size:11px;opacity:.85;margin-top:2px">${esc(s.address)}</div>`:""}</div>
<div class="receipt-meta">OFFICIAL RECEIPT<br>No. ${esc(x.no)}<br>${fdate(x.date)}</div></div>
<div class="bd"><p>Received from: <b>Parent / Guardian of ${esc(p.name)}</b></p>
<p>Class: ${esc(p.cls)}${p.adm?" · Adm No: "+esc(p.adm):""}</p>
<div class="amt">${esc(s.cur)} ${money(x.amt)}</div>
<p>Payment method: <b>${esc(x.method||"Cash")}</b>${x.note?" · "+esc(x.note):""}</p>
<p>Being: School fees for <b>${esc(s.term)} ${esc(s.year)}</b></p>
<p style="margin-top:12px;font-size:12px;background:#f5f7fa;padding:8px;border-radius:4px">Total due: <b>${money(p.due)}</b> · Paid to date: <b>${money(to)}</b> · Balance: <b>${money(bal)}</b></p>
${s.motto?`<p style="font-size:12px;font-style:italic;margin-top:12px;color:#555">${esc(s.motto)}</p>`:""}
<p style="margin-top:20px;font-size:12px">Received by: _________________________ (${roleName})</p>
<p style="font-size:11px;color:#666;margin-top:4px">Computer-generated receipt. Valid when issued from the official system.</p></div>
<div class="ft noprint"><a class="b wa sm" target="_blank" rel="noopener" href="${wa(p,text)}">Send via WhatsApp</a><button class="b sm" onclick="window.print()">Print</button><button class="b b2 sm" onclick="modal=null;render()">Close</button></div></div></div>`}

function showStatement(pid){const p=P_(pid);if(!p)return;const c=calc(p),arr=p.arr||0;modal={type:"statement",p,c,arr};render()}
function statementUI(){
const{p,c,arr}=modal,s=S.school,pays=(p.pays||[]).filter(x=>!x.void);
return`<div class="modal" onclick="if(event.target===this){modal=null;render()}"><div class="statement">
<div class="sh"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div>
${s.logo?`<img src="${s.logo}" style="height:40px;border-radius:4px;margin-bottom:8px;background:#fff">`:""}
<div style="font-weight:700;font-size:16px">${esc(s.name)}</div>
${s.address?`<div style="font-size:11px;opacity:.85">${esc(s.address)}</div>`:""}
${s.phone?`<div style="font-size:11px;opacity:.85">Tel: ${esc(s.phone)}</div>`:""}</div>
<div style="text-align:right;font-size:12px">FEE STATEMENT<br>${esc(s.term)} ${esc(s.year)}</div></div></div>
<div class="sb"><p style="margin:0 0 4px"><b>${esc(p.name)}</b></p>
<p class="mut" style="margin:0 0 12px">${esc(p.cls)}${p.adm?" · Admission #"+esc(p.adm):""}${p.phone?" · "+esc(showPh(p.phone)):""}</p>
<table><tr><th>Description</th><th style="text-align:right">Amount (${esc(s.cur)})</th></tr>
<tr><td>Current term fee</td><td style="text-align:right">${money(p.due-arr)}</td></tr>
${arr?`<tr><td>Arrears brought forward</td><td style="text-align:right">${money(arr)}</td></tr>`:""}
<tr><td><b>Total due</b></td><td style="text-align:right"><b>${money(p.due)}</b></td></tr>
<tr><td>Total paid</td><td style="text-align:right">${money(c.paid)}</td></tr>
<tr style="background:#f8fafc"><td><b>Outstanding balance</b></td><td style="text-align:right"><b>${money(Math.max(c.bal,0))}</b></td></tr></table>
${pays.length?`<p style="font-size:12px;font-weight:700;margin:16px 0 6px">Payment history</p><table><tr><th>Date</th><th>Method</th><th>Receipt</th><th style="text-align:right">Amount</th></tr>
${pays.map(x=>`<tr><td>${fdate(x.date)}</td><td>${esc(x.method||"Cash")}</td><td>${esc(x.no)}</td><td style="text-align:right">${money(x.amt)}</td></tr>`).join("")}</table>`:`<p class="mut">No payments recorded this term.</p>`}
<p style="font-size:11px;color:#666;margin-top:20px">Generated on ${fdate(today())}. Issued by ${esc(s.name)}.</p></div>
<div class="ft noprint" style="padding:0 16px 16px;display:flex;gap:8px"><button class="b sm" onclick="window.print()">Print statement</button><button class="b b2 sm" onclick="modal=null;render()">Close</button></div></div></div>`}

function render(){
const s=S.school;document.body.className=role==="h"?"ro":"";
if(!role){$("#app").innerHTML=lockUI();$("#tabs").innerHTML="";$("#modal").innerHTML="";return}
const logoHtml=s.logo?`<img src="${s.logo}" alt="Logo">`:"";
$("#app").innerHTML=`<header><div class="header-actions"><button class="icon-btn" onclick="cycleTheme()">Theme</button><button class="icon-btn" onclick="lock()">Lock</button></div>
<div class="brand">${logoHtml}<div><div class="sn">${esc(s.name)}</div><div class="sub">${esc(s.term)} ${esc(s.year)} · ${{b:"Bursar",h:"Head Teacher (View Only)",d:"Administrator"}[role]}</div></div></div></header>
${sel?detail():tab==="home"?home():tab==="pupils"?pupils():tab==="rem"?rem():sett()}`;
$("#tabs").innerHTML=[["home","Home"],["pupils","Pupils"],["rem","Reminders"],["set","Settings"]].map(([k,l])=>`<button class="${!sel&&tab===k||(sel&&k==="pupils")?"on":""}" onclick="tab='${k}';sel=null;render();scrollTo(0,0)">${l}</button>`).join("");
$("#modal").innerHTML=modal?(modal.type==="statement"?statementUI():rcpt()):"";
}
function cycleTheme(){const o=["system","light","dark"];S.theme=o[(o.indexOf(S.theme||"system")+1)%3];applyTheme();save();toast("Theme: "+S.theme);render()}
const pick=id=>{sel=id;render();scrollTo(0,0)};
function ask(b,key,fn){if(armed===key){armed=null;fn();return}armed=key;const t=b.textContent;b.textContent="Tap again to confirm";setTimeout(()=>{if(armed===key){armed=null;b.textContent=t}},3500)}
function addP(){const n=$("#an").value.trim(),c=$("#ac").value.trim();if(!n||!c){toast("Name and class are required");return}
const f=num($("#af").value)||feeFor(c),adm=($("#aa").value.trim()||nextAdm());
if(S.pupils.some(p=>p.adm&&p.adm===adm)){toast("Admission number already exists");return}
S.pupils.push({id:uid(),name:n,cls:c,adm,phone:ph($("#ap").value),due:f,base:f,arr:0,pays:[]});logit("Registered pupil "+n);render();toast("Pupil registered")}
function addMany(){let k=0;$("#bk").value.split("\n").forEach(l=>{const a=l.split(/[,\t]/).map(x=>x.trim());if(a.length<2||!a[0])return;
let name=a[0],cls=a[1],phone="",fee=0;if(a.length===3){if(/^\d/.test(a[2].replace(/[^\d]/g,"")))fee=num(a[2]);else phone=a[2]}else if(a.length>=4){phone=a[2];fee=num(a[3])}
if(!fee)fee=feeFor(cls);S.pupils.push({id:uid(),name,cls,adm:nextAdm(),phone:ph(phone),due:fee,base:fee,arr:0,pays:[]});k++});
if(k){logit(k+" pupils registered in bulk");render();toast(k+" pupils registered")}else toast("Nothing to add")}
function addPay(id){const p=P_(id),amt=num($("#pa").value);if(!amt||amt<=0){toast("Enter a valid amount");return}
S.rc=(S.rc||0)+1;const x={id:uid(),amt,date:$("#pd").value||today(),note:$("#pn").value.trim(),method:$("#pm").value||"Cash",no:`R-${S.school.year}-${String(S.rc).padStart(4,"0")}`};
p.pays.push(x);logit(`Payment ${x.no} ${money(x.amt)} (${x.method}) – ${p.name}`);render();showR(id,x.id)}
function showR(pid,xid){const p=P_(pid);let to=0,x;for(const y of p.pays){to+=y.void?0:y.amt;if(y.id===xid){x=y;break}}modal={p,x,to};render()}
function pr(m,d){return new Promise(r=>{const e=document.createElement("div");e.className="modal";e.style.zIndex=50;e.innerHTML=`<div class="card" style="width:100%;max-width:360px"><label>${esc(m)}</label><input id="pri" value="${esc(d||"")}"><button class="b" id="pok">OK</button> <button class="b b2" id="pcn">Cancel</button></div>`;document.body.appendChild(e);const i=e.querySelector("#pri"),f=v=>{e.remove();r(v)};i.focus();e.querySelector("#pok").onclick=()=>f(i.value);e.querySelector("#pcn").onclick=()=>f(null);i.onkeydown=k=>{if(k.key==="Enter")f(i.value)}})}
async function voidPay(pid,xid){const p=P_(pid),x=p.pays.find(y=>y.id===xid),why=((await pr("Reason for voiding this payment?"))||"").trim();if(!why){toast("A reason is required");return}x.void={why,by:role};logit(`VOID ${x.no} ${money(x.amt)} – ${p.name}: ${why}`);render();toast("Payment voided")}
function editP(id){const p=P_(id);p.name=$("#en").value.trim()||p.name;p.adm=$("#ea").value.trim();p.cls=$("#ec").value.trim()||p.cls;p.phone=ph($("#ep").value);const newDue=num($("#ef").value);if(newDue!==p.due){p.due=newDue;p.base=newDue-(p.arr||0)}logit("Updated record – "+p.name);render();toast("Changes saved")}
function delP(id){const p=P_(id);if(p.pays.length&&role!=="d"){toast("Only an administrator can delete a pupil with payments");return}logit("Deleted pupil – "+p.name);S.pupils=S.pupils.filter(q=>q.id!==id);sel=null;save();render();toast("Pupil removed")}
function loadLogo(input){const f=input.files[0];if(!f)return;if(f.size>400000){toast("Logo too large (max 400KB)");return}const r=new FileReader();r.onload=()=>{S.school.logo=r.result;save();render();toast("Logo added")};r.readAsDataURL(f)}
function backup(){S.lb=Date.now();save();const t=$("#bt");t.value=JSON.stringify(S);t.focus();t.select();toast("Backup text ready")}
function restore(){try{const o=JSON.parse($("#bt").value);if(!o||!Array.isArray(o.pupils)||!o.school)throw 0;S=o;mig();logit("Restored from backup");render();toast("Restore complete")}catch(e){toast("Invalid backup data")}}
function lockUI(){const A=S.auth;if(!A.b)return`<div class="card lk"><h2 style="text-transform:none;letter-spacing:0;font-size:18px">System setup</h2><p class="mut">Done once by the person installing the system.</p>
<label>School name</label><input id="sn" value="${esc(S.school.name)}"><label>Bursar PIN (4–6 digits)</label><input id="p1" type="password" inputmode="numeric" maxlength="6">
<label>Head teacher PIN (4–6 digits)</label><input id="p2" type="password" inputmode="numeric" maxlength="6">
<label>Administrator code (6+ characters)</label><input id="p3" type="password"><button class="b" onclick="setup()">Create system & continue</button></div>`;
return`<div class="card lk"><h2 style="text-transform:none;letter-spacing:0;font-size:18px">${esc(S.school.name)}</h2><p class="mut">Enter your PIN to access the fees system.</p>
<input id="pin" type="password" placeholder="PIN" autofocus onkeydown="if(event.key==='Enter')unlock()"><button class="b" onclick="unlock()">Unlock</button></div>`}
function setup(){const a=$("#p1").value.trim(),b=$("#p2").value.trim(),c=$("#p3").value;if(!/^\d{4,6}$/.test(a)||!/^\d{4,6}$/.test(b)||a===b||c.length<6){toast("PINs: 4–6 digits and different. Admin code: 6+ characters");return}
S.school.name=$("#sn").value.trim()||S.school.name;S.auth={b:hh(a),h:hh(b),d:hh(c)};role="d";logit("System security configured");bump();render()}
function unlock(){if(Date.now()<wait){toast("Too many attempts. Wait 30 seconds.");return}const v=hh($("#pin").value.trim()),A=S.auth,r=v===A.b?"b":v===A.h?"h":v===A.d?"d":null;
if(!r){if(++tries>=5){tries=0;wait=Date.now()+3e4}toast("Incorrect PIN");return}tries=0;role=r;tab="home";sel=null;bump();render()}
function newPins(){const a=$("#n1").value.trim(),b=$("#n2").value.trim();if(!/^\d{4,6}$/.test(a)||!/^\d{4,6}$/.test(b)||a===b){toast("PINs: 4–6 digits and different");return}S.auth.b=hh(a);S.auth.h=hh(b);logit("PINs updated");render();toast("PINs updated")}
function dl(n,x,m){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([x],{type:m}));a.download=n;a.click()}
function bkFile(){S.lb=Date.now();logit("Backup downloaded");dl("fees-backup-"+nowL().slice(0,10)+".json",JSON.stringify(S),"application/json");render()}
function rf(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("#bt").value=r.result;toast("File loaded. Tap Restore.")};r.readAsText(f)}
function csv(o){const rows=[["Admission","Name","Class","Phone","Current Fee","Arrears","Total Due","Paid","Balance","Status"]];
S.pupils.forEach(p=>{const c=calc(p);if(o&&c.bal<=0)return;const arr=p.arr||0;rows.push([p.adm||"",p.name,p.cls,showPh(p.phone||""),p.due-arr,arr,p.due,c.paid,Math.max(c.bal,0),c.st])});
dl((o?"defaulters-":"pupils-")+nowL().slice(0,10)+".csv","\ufeff"+rows.map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n"),"text/csv");logit("Exported "+(o?"defaulters":"full register")+" CSV")}
async function newTerm(){const n=((await pr("Name of the new term (e.g. Term 1)"))||"").trim();if(!n)return;
const y=((await pr("Academic year",S.school.year))||"").trim()||S.school.year,fee=await pr("New standard fee per pupil (leave blank to keep each pupil’s base fee)");
if(((await pr("Type YES to close "+S.school.term+" "+S.school.year+" and open "+n+" "+y+". Balances carry forward as arrears."))||"").trim().toUpperCase()!=="YES")return;
S.pupils.forEach(p=>{const c=calc(p),b=p.base!=null?p.base:p.due,f=fee&&num(fee)?num(fee):b;(p.hist=p.hist||[]).push({t:S.school.term+" "+S.school.year,d:p.due,p:c.paid});p.base=f;p.arr=c.bal;p.due=f+c.bal;p.pays=[]});
S.school.term=n;S.school.year=y;logit("Opened new term: "+n+" "+y);render();toast("New term started")}
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();
</script>
</body>
</html>
